name: Windows build

on:
  workflow_call:
    inputs:
      release-tag:
        type: string
        required: false
        default: ''
    outputs:
      commit:
        description: Exact source commit used to build
        value: ${{ jobs.build.outputs.commit }}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ inputs.release-tag }}
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release-tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record and validate source
        id: source
        run: |
          "commit=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          if ($env:RELEASE_TAG) {
            git merge-base --is-ancestor HEAD origin/main
            if ($LASTEXITCODE -ne 0) { throw 'Release commit must be on main.' }
          }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.14.0'
          cache: npm
          package-manager-cache: false
      - name: Set up Rust
        run: |
          rustup toolchain install 1.92.0 --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed.' }
          rustup override set 1.92.0
      - run: npm ci
      - run: node scripts/version.cjs --check
      - run: npm test
      - run: npm run test:ui
      - run: npm run test:rust
      - name: Build portable executable
        run: npm run desktop:build -- --target x86_64-pc-windows-msvc -- --locked
      - name: Package clean release files
        run: ./scripts/package-release.ps1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-x86_64-release
          path: |
            release/*/*.exe
            release/*/*.zip
            release/*/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
